<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Multi AI Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>AI Hub</h1>

    <select id="model">
      <option value="gemini">Gemini (Free)</option>
      <option value="groq">Groq (Free)</option>

    <input id="input" placeholder="Type something..." />

  </div>

  <script src="app.js"></script>
</body>
</html>
